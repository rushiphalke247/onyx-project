---
# Jenkins Configuration Variables
#
# Dynamic domain resolution precedence:
# 1. CLI extra-vars: -e "jenkins_domain=custom.domain.com"
# 2. Environment variable: export JENKINS_DOMAIN=custom.domain.com
# 3. Default fallback: jenkins.ajuna.website
#
jenkins_domain: "{{ lookup('env', 'JENKINS_DOMAIN') | default('jenkins.ajuna.website', true) }}"
jenkins_port: 8080
app_user: "ec2-user"
app_project_dir: "/home/ec2-user/ONYX"
web_root: "/var/www/onyx"
jenkins_repo_url: "https://pkg.jenkins.io/redhat-stable/jenkins.repo"
jenkins_gpg_key_url: "https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key"
